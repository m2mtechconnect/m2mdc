name: P1 Static Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static-gate:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    concurrency:
      group: p1-static-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
