name: AURA Demo Integrations

on:
  pull_request:
    branches: [phase7-aura-integration-gateway]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  demo-integration-checks:
    name: Demo integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: White-label customer-surface regression
        run: bunx vitest run src/config/__tests__/customerSurfaceWhiteLabel.test.ts src/config/__tests__/auraRuntimeCatalog.test.ts
