name: AURA Simulation Fidelity Qualification

on:
  pull_request:
    branches:
      - dsx/aura-blueprint-asset-remediation
      - ux/aura-platform-followup-hardening
    paths:
      - 'src/simulation/**'
      - 'src/pages/SimulationPreview.tsx'
      - 'src/lib/provenance/**'
      - 'docs/audit/aura-simulation-fidelity-qualification.md'
      - '.github/workflows/aura-simulation-fidelity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  AURA_RELEASE_ENVIRONMENT: preview
  PROD_BASE_URL: https://auradc.m2mtechconnect.com
  VITE_SUPABASE_URL: https://preview-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: preview-public-placeholder

jobs:
  simulation-fidelity:
    name: Simulation fidelity claims, provenance and fail-closed baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Simulation fidelity and provider contract tests
        run: >-
          bunx vitest run
          src/simulation/__tests__/fidelity.test.ts
          src/simulation/__tests__/SimulationEngine.preflight.test.ts
          src/simulation/__tests__/engineConsolidation.test.ts
          src/simulation/providers/__tests__/contract.test.ts
          src/simulation/providers/__tests__/providerSelection.test.ts
          src/simulation/providers/__tests__/scenarioLibraryProvider.test.ts
          src/simulation/providers/__tests__/panelFacade.test.ts

      - name: Production-mode application build
        env:
          AURA_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AURA_RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          AURA_BUILD_ID: simulation-fidelity-${{ github.run_id }}-${{ github.run_attempt }}
        run: bun run build
