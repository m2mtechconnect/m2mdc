name: Release Target Verification

# Provider-neutral verification after an external staging/production publish.
# This workflow proves that the requested Git commit builds successfully and
# that the supplied live target responds to release smoke/SEO checks. It does
# NOT claim that the external hosting provider deployed that SHA unless the
# deployment_reference is independently tied to an immutable provider release.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      expected_sha:
        description: 'Exact Git commit SHA approved for this verification'
        required: true
        type: string
      target_url:
        description: 'Published HTTPS target URL'
        required: true
        type: string
      deployment_reference:
        description: 'External provider publish/deployment reference'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-target-${{ inputs.environment }}-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  source-build:
    name: Verify exact source SHA and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checked_sha: ${{ steps.source.outputs.checked_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify exact source SHA
        id: source
        shell: bash
        run: |
          checked_sha="$(git rev-parse HEAD)"
          echo "checked_sha=$checked_sha" >> "$GITHUB_OUTPUT"
          if [ "$checked_sha" != "${{ inputs.expected_sha }}" ]; then
            echo "Requested SHA does not match checked-out source."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build exact release source
        run: bun run build
        env:
          CI: 'true'

      - name: Upload exact-SHA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ inputs.expected_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  live-target:
    name: Verify published target
    needs: source-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      TARGET_URL: ${{ inputs.target_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      DEPLOYMENT_REFERENCE: ${{ inputs.deployment_reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate target URL
        shell: bash
        run: |
          case "$TARGET_URL" in
            https://*) ;;
            *) echo "Release verification requires an HTTPS target URL."; exit 1 ;;
          esac

      - name: Smoke published routes
        shell: bash
        run: |
          base="${TARGET_URL%/}"
          for route in "/" "/manage/integrations" "/admin/platform-readiness"; do
            echo "Checking ${base}${route}"
            curl --fail --location --silent --show-error --max-time 30 \
              --output /dev/null "${base}${route}"
          done

      - name: Run pinned published SEO validation
        run: |
          npm install -g tsx@4.23.12
          tsx scripts/validateSeo.ts "$TARGET_URL"

      - name: Write release verification attestation
        shell: bash
        run: |
          mkdir -p release-verification
          node - <<'NODE'
          const fs = require('fs');
          const payload = {
            schema: 'aura.release-target-verification.v1',
            environment: process.env.RELEASE_ENV,
            expectedSha: process.env.EXPECTED_SHA,
            sourceBuildSha: process.env.CHECKED_SHA,
            targetUrl: process.env.TARGET_URL,
            deploymentReference: process.env.DEPLOYMENT_REFERENCE,
            verifiedAt: new Date().toISOString(),
            githubRunId: process.env.GITHUB_RUN_ID,
            githubRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            liveTargetResponded: true,
            deploymentShaBinding: 'NOT_PROVEN_BY_THIS_WORKFLOW',
            note: 'The external deployment reference must independently prove which immutable source SHA was published before production approval.'
          };
          fs.writeFileSync('release-verification/attestation.json', JSON.stringify(payload, null, 2));
          NODE
        env:
          RELEASE_ENV: ${{ inputs.environment }}
          CHECKED_SHA: ${{ needs.source-build.outputs.checked_sha }}

      - name: Upload release verification attestation
        uses: actions/upload-artifact@v4
        with:
          name: release-target-verification-${{ inputs.environment }}-${{ inputs.expected_sha }}
          path: release-verification/attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize verification boundary
        shell: bash
        run: |
          {
            echo "### AURA release target verification"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Expected SHA: $EXPECTED_SHA"
            echo "- Built source SHA: ${{ needs.source-build.outputs.checked_sha }}"
            echo "- Target: $TARGET_URL"
            echo "- External deployment reference: $DEPLOYMENT_REFERENCE"
            echo "- Live route/SEO verification: passed"
            echo "- Provider-side SHA binding: **not proven by this workflow**"
            echo ""
            echo "Production approval remains blocked until the deployment provider reference is independently shown to map to the exact qualified SHA."
          } >> "$GITHUB_STEP_SUMMARY"
