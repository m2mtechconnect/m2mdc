# DSX Exchange local broker configuration (development / verification only).
listener 1883 0.0.0.0
# Container port is published only on 127.0.0.1 by docker-compose.
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
max_queued_messages 10000
