name: Phase 3 External Validation

# Closes the Phase 3 infrastructure gate against an EPHEMERAL local Supabase
# stack. The production project is never reachable from this job: no production
# secrets are exposed to it, and the validator refuses any non-local API URL
# when --require-infrastructure is set.

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/phase3/**'
      - 'scripts/ci/**'
      - '.github/workflows/phase3-external-validation.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/phase3/**'
      - 'scripts/ci/**'
      - '.github/workflows/phase3-external-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-external-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Ephemeral Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Explicitly neutralise any ambient production configuration.
      SUPABASE_PROJECT_ID: ''
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare immutable clean replay
        run: bash scripts/ci/ephemeral-supabase.sh prepare

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.34.3

      - name: Record tool versions
        run: bash scripts/ci/ephemeral-supabase.sh record-versions

      - name: Start ephemeral Supabase stack
        run: bash scripts/ci/ephemeral-supabase.sh start

      - name: Capture local credentials
        run: bash scripts/ci/ephemeral-supabase.sh capture

      - name: Serve edge functions
        run: bash scripts/ci/ephemeral-supabase.sh serve-functions

      - name: Run Phase 3 external validation
        run: |
          node scripts/phase3/external-validation.mjs \
            --require-infrastructure \
            --json phase3-external-validation.json

      - name: Edge function logs
        if: always()
        run: bash scripts/ci/ephemeral-supabase.sh function-logs

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-external-validation-${{ env.AURA_SOURCE_SHA }}
          path: phase3-external-validation.json
          if-no-files-found: warn

      - name: Stop stack
        if: always()
        run: bash scripts/ci/ephemeral-supabase.sh stop
