name: Lovable Production Mirror

# GitHub `main` is the authoritative production source. The existing Lovable
# project is still bound to remediation/hybrid-stack-p0, so keep that ref as a
# fast-forward-only compatibility mirror until the provider connection can be
# repointed directly to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lovable-production-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Fast-forward production compatibility ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source is authoritative main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Fast-forward compatibility mirror
        shell: bash
        env:
          MIRROR_REF: remediation/hybrid-stack-p0
        run: |
          set -euo pipefail
          git fetch origin "$MIRROR_REF"
          mirror_sha="$(git rev-parse FETCH_HEAD)"

          if [ "$mirror_sha" = "$GITHUB_SHA" ]; then
            echo "Mirror already matches main: $GITHUB_SHA"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$mirror_sha" "$GITHUB_SHA"; then
            echo "PRODUCTION_MIRROR_BLOCKED: $MIRROR_REF diverged from main. Refusing force update."
            echo "mirror=$mirror_sha"
            echo "main=$GITHUB_SHA"
            exit 1
          fi

          git push origin "$GITHUB_SHA:refs/heads/$MIRROR_REF"

      - name: Verify exact ref binding
        shell: bash
        env:
          MIRROR_REF: remediation/hybrid-stack-p0
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$MIRROR_REF" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          {
            echo "### Lovable production compatibility mirror"
            echo ""
            echo "- Authoritative source: main @ $GITHUB_SHA"
            echo "- Mirrored ref: $MIRROR_REF @ $remote_sha"
            echo "- Update mode: fast-forward only"
          } >> "$GITHUB_STEP_SUMMARY"
