name: Twin canvas / GPU matrix

# Runs the twin-canvas mounting test across rendering environments and reports
# genuine product failures separately from hardware-runner availability.
#
# The software lane runs automatically and gates this workflow.
# The hardware GPU lane is advisory and runs only when explicitly dispatched,
# so a missing optional GPU runner cannot leave ordinary PR qualification stuck.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/components/twin-visualization/**'
      - 'src/three/**'
      - 'tests/truth-in-ui/twin-canvas-mounting.spec.ts'
      - 'tests/truth-in-ui/_setup/renderer.ts'
      - 'playwright.gpu.config.ts'
      - 'scripts/report-gpu-matrix.mjs'
      - '.github/workflows/twin-canvas-gpu-matrix.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      run_gpu_lane:
        description: 'Also run the optional hardware GPU lane'
        type: boolean
        default: false

permissions:
  contents: read

env:
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  software:
    name: Twin canvas (software)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: twin-canvas-software-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      AURA_GPU_LANE: software
      AURA_GPU_REQUIRED: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: Report rendering environment
        run: |
          echo "release_source_sha=${AURA_SOURCE_SHA}"
          echo "lane=${AURA_GPU_LANE} gpu_required=${AURA_GPU_REQUIRED}"
          (command -v glxinfo >/dev/null && glxinfo -B) || echo "no glxinfo on this runner"
      - name: Run twin-canvas mounting test
        id: run
        continue-on-error: true
        run: bunx playwright test --config=playwright.gpu.config.ts
      - name: Classify software result
        run: node scripts/report-gpu-matrix.mjs "test-results/gpu-matrix-${AURA_GPU_LANE}.json"
      - name: Upload software artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-canvas-software-${{ env.AURA_SOURCE_SHA }}
          path: |
            test-results/gpu-matrix-software.json
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

  gpu:
    name: Twin canvas (hardware GPU, advisory)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu_lane == true
    runs-on: ubuntu-latest-gpu
    continue-on-error: true
    timeout-minutes: 25
    concurrency:
      group: twin-canvas-gpu-${{ github.ref }}
      cancel-in-progress: false
    env:
      AURA_GPU_LANE: gpu
      AURA_GPU_REQUIRED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: Report GPU environment
        run: |
          echo "release_source_sha=${AURA_SOURCE_SHA}"
          echo "lane=${AURA_GPU_LANE} gpu_required=${AURA_GPU_REQUIRED}"
          (command -v nvidia-smi >/dev/null && nvidia-smi) || echo "no nvidia-smi on this runner"
          (command -v glxinfo >/dev/null && glxinfo -B) || echo "no glxinfo on this runner"
      - name: Run twin-canvas mounting test
        id: run
        continue-on-error: true
        run: bunx playwright test --config=playwright.gpu.config.ts
      - name: Classify hardware result
        run: node scripts/report-gpu-matrix.mjs "test-results/gpu-matrix-${AURA_GPU_LANE}.json"
      - name: Upload GPU artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-canvas-gpu-${{ env.AURA_SOURCE_SHA }}
          path: |
            test-results/gpu-matrix-gpu.json
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: Twin canvas matrix summary
    runs-on: ubuntu-latest
    concurrency:
      group: twin-canvas-summary-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [software, gpu]
    if: always()
    steps:
      - name: Report
        shell: bash
        run: |
          {
            echo "### Twin canvas GPU matrix"
            echo ""
            echo "- release source SHA: $AURA_SOURCE_SHA"
            echo "- software lane: ${{ needs.software.result }}"
            echo "- hardware GPU lane: ${{ needs.gpu.result }}"
            echo ""
            echo "The software lane is required. The hardware GPU lane is advisory and is only scheduled by explicit workflow dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.software.result }}" != "success" ]; then
            echo "Software twin-canvas validation failed."
            exit 1
          fi
