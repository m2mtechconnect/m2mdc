name: Data Centre Template Scope Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/lib/templates/**'
      - 'src/lib/intake/**'
      - 'src/lib/builder/**'
      - 'src/stores/**'
      - 'src/components/templates/**'
      - 'src/config/appNavigation.ts'
      - 'tests/unit/non-dc-templates-removed.test.ts'
      - 'tests/unit/shell-navigation-performance-contract.test.ts'
      - 'tests/integration/template-url-loading.test.ts'
      - '.github/workflows/yvr-regression.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/lib/templates/**'
      - 'src/lib/intake/**'
      - 'src/lib/builder/**'
      - 'src/stores/**'
      - 'src/components/templates/**'
      - 'src/config/appNavigation.ts'
      - 'tests/unit/non-dc-templates-removed.test.ts'
      - 'tests/unit/shell-navigation-performance-contract.test.ts'
      - 'tests/integration/template-url-loading.test.ts'
      - '.github/workflows/yvr-regression.yml'

env:
  CI: true
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  yvr-unit-tests:
    name: Data Centre Template Scope
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce the data-centre-only template boundary
        run: bun run test -- tests/unit/non-dc-templates-removed.test.ts

  yvr-integration-tests:
    name: Builder Template Wiring
    runs-on: ubuntu-latest
    needs: yvr-unit-tests

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Builder template and draft URL wiring
        run: bun run test -- tests/integration/template-url-loading.test.ts

  yvr-e2e-tests:
    name: Navigation Performance Contract
    runs-on: ubuntu-latest
    needs: [yvr-unit-tests, yvr-integration-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify shell navigation performance wiring
        run: bun run test -- tests/unit/shell-navigation-performance-contract.test.ts

  yvr-regression-summary:
    name: Template Scope Summary
    runs-on: ubuntu-latest
    needs: [yvr-unit-tests, yvr-integration-tests, yvr-e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.yvr-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.yvr-integration-tests.result }}" != "success" ] || \
             [ "${{ needs.yvr-e2e-tests.result }}" != "success" ]; then
            echo "DATA CENTRE TEMPLATE SCOPE TESTS FAILED"
            echo "One or more current product contracts failed. Check the logs above."
            exit 1
          else
            echo "DATA CENTRE TEMPLATE SCOPE TESTS PASSED"
            echo "The data-centre boundary, Builder wiring, and navigation contract are passing."
          fi

  block-on-failure:
    name: Block Merge on Template Scope Failure
    runs-on: ubuntu-latest
    needs: yvr-regression-summary
    if: failure()

    steps:
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: '## Data Centre Template Scope Tests Failed\n\nThe data-centre template boundary, Builder URL wiring, or navigation performance contract failed. This PR must remain blocked until the current product contracts pass. Review the failed job logs, correct the diagnosed issue, and qualify the new exact head.'
            })

      - name: Fail the workflow
        run: exit 1
