name: AURA Legacy Frontend Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-frontend-guard:
    name: Legacy Frontend Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify retired frontend surfaces stay removed
        run: node scripts/verify-no-legacy-frontend.mjs
