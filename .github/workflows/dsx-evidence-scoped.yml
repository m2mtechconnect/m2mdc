name: DSX / Evidence Scoped Checks

# Scoped gate for the DSX + Evidence surface only.
#
# The legacy suites in test.yml carry known pre-existing failures that are
# unrelated to this surface. Running DSX lint and DSX unit tests in their own
# workflow keeps that surface independently green and blockable, without
# waiting on (or being blocked by) the legacy jobs.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

env:
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  dsx-lint:
    name: DSX lint (scoped)
    runs-on: ubuntu-latest
    concurrency:
      group: dsx-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint DSX / Evidence sources
        run: bun run lint:dsx

  dsx-unit-tests:
    name: DSX unit tests (scoped)
    runs-on: ubuntu-latest
    concurrency:
      group: dsx-unit-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run DSX / Evidence unit tests
        run: bun run test:dsx -- --reporter=default --reporter=junit --outputFile=dsx-test-results.xml
      - name: Upload DSX test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsx-test-results-${{ env.AURA_SOURCE_SHA }}
          path: dsx-test-results.xml
          if-no-files-found: ignore
          retention-days: 30

  dsx-scoped-summary:
    name: DSX scoped summary
    runs-on: ubuntu-latest
    concurrency:
      group: dsx-summary-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [dsx-lint, dsx-unit-tests]
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "### DSX / Evidence scoped checks"
            echo ""
            echo "- release source SHA: $AURA_SOURCE_SHA"
            echo "- lint: ${{ needs.dsx-lint.result }}"
            echo "- unit tests: ${{ needs.dsx-unit-tests.result }}"
            echo ""
            echo "Legacy suites run separately in \`test.yml\` and do not gate this scope."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.dsx-lint.result }}" = "success" ] && [ "${{ needs.dsx-unit-tests.result }}" = "success" ]
