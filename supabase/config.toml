project_id = "psfvrskpnwcshvajzeix"

# PR-0.1 Checkpoint B: green-dc-recommend is DISABLED for the pilot surface.
# Gateway JWT verification is restored to the default (true) as defense in
# depth. The function is excluded from the production allowlist
# (docs/remediation/evidence/pr-0.1/route-allowlist.json) and its runtime
# path fails closed. Do NOT re-add `verify_jwt = false` without an
# explicitly approved signed-webhook classification.
[functions.green-dc-recommend]
verify_jwt = true

# Phase 2.b DSX ingest boundary. The DSX gateway signs its own JWT with a
# key that Supabase cannot verify, so the platform's JWT check must be
# bypassed. The handler performs mandatory in-code verification of the
# custom gateway token (algorithm pin, signature, iss/aud/sub/exp/iat/skew,
# connection status, subject allowlist) before any state read or ingest.
[functions.dsx-ingest]
verify_jwt = false

# Public intake (onboarding + contact). Anonymous callers must reach it, so the
# gateway JWT check is off; the handler derives identity server-side from any
# supplied bearer token, validates schema, rate limits per IP/user and
# suppresses duplicates. Direct anonymous table inserts are revoked.
[functions.public-intake]
verify_jwt = false

# NVIDIA operational-readiness Phase 1 - CORS/authorization reconciliation.
# These functions construct a SERVICE_ROLE client and perform no in-code
# identity check while answering wildcard-CORS requests. Until each one is
# rewritten to derive identity from the caller and scope its reads to that
# tenant, the gateway JWT check is made explicit so an anonymous origin cannot
# reach a service-role query. `zapier-oauth-callback` is deliberately excluded:
# it is an OAuth redirect target that anonymous browsers must reach, and it
# validates its own state parameter.
[functions.metrics-summary]
verify_jwt = true

[functions.ops-environments]
verify_jwt = true

[functions.ops-events]
verify_jwt = true

[functions.ops-ingest-health]
verify_jwt = true

[functions.templates-seed]
verify_jwt = true

[functions.website-cache-clear]
verify_jwt = true

[functions.funding-scraper]
verify_jwt = true

[functions.zapier-apps-sync]
verify_jwt = true

[functions.zapier-auto-refresh]
verify_jwt = true

[functions.zapier-action-execute]
verify_jwt = true
