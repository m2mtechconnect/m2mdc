name: AURA Agentic Architecture Qualification

on:
  pull_request:
    paths:
      - 'src/agents/**'
      - 'src/auth/**'
      - 'src/components/builder/ModelMarketplace.tsx'
      - 'src/domain/greenDc/**'
      - 'src/pages/AISettings.tsx'
      - 'src/connections/**'
      - 'supabase/functions/_shared/ai-client.ts'
      - 'supabase/functions/_shared/model-router.ts'
      - 'supabase/functions/_shared/model-router.test.ts'
      - 'supabase/functions/_shared/ai-provider-*.ts'
      - 'supabase/functions/_shared/connection-admin-policy*'
      - 'supabase/functions/_shared/connection-health-policy*'
      - 'supabase/functions/agent-*/**'
      - 'supabase/functions/ai-config/**'
      - 'supabase/functions/models-test/**'
      - 'supabase/functions/connection-health-check/**'
      - 'supabase/functions/connection-provision/**'
      - 'supabase/functions/connection-credential/**'
      - 'supabase/migrations/*nvidia_ai_provider*'
      - '.github/workflows/aura-agentic-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  AURA_RELEASE_ENVIRONMENT: preview
  VITE_SUPABASE_URL: https://preview-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: preview-public-placeholder

jobs:
  agentic-architecture:
    name: Provider routing, agent truth and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Canonical auth and AI provider tests
        run: >-
          bunx vitest run
          src/auth/__tests__/permissions.test.ts
          src/agents/__tests__/agentModelArchitecture.test.ts
          src/agents/__tests__/modelPolicy.test.ts
          src/domain/greenDc/__tests__/agentsCatalogTruth.test.ts
          supabase/functions/_shared/model-router.test.ts
          supabase/functions/_shared/ai-provider-policy.test.ts
          supabase/functions/_shared/connection-admin-policy.test.ts
          supabase/functions/_shared/connection-health-policy.test.ts

      - name: Production build
        run: bun run build
