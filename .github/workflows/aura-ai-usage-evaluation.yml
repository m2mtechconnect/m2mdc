name: AURA AI Usage & Model Evaluation Qualification

on:
  pull_request:
    paths:
      - 'src/agents/__tests__/aiUsageArchitecture.test.ts'
      - 'src/evaluation/**'
      - 'src/data/dsxReference/**'
      - 'src/data/dataset/referenceSelectors.ts'
      - 'supabase/functions/_shared/ai-usage*.ts'
      - 'supabase/functions/agent-*/**'
      - 'supabase/functions/models-test/**'
      - 'supabase/functions/model-*/**'
      - 'supabase/migrations/*aura_ai_usage*'
      - '.github/workflows/aura-ai-usage-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  AURA_RELEASE_ENVIRONMENT: preview
  VITE_SUPABASE_URL: https://preview-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: preview-public-placeholder

jobs:
  usage-evaluation:
    name: Durable usage controls and evaluation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Durable AI usage and evaluation tests
        run: >-
          bunx vitest run
          supabase/functions/_shared/ai-usage-policy.test.ts
          src/agents/__tests__/aiUsageArchitecture.test.ts

      - name: Production build
        run: bun run build
