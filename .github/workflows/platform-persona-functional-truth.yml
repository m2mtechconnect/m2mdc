name: AURA Platform Persona Functional Truth

on:
  pull_request:
    branches:
      - ux/aura-builder-connections-remediation
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  platform-persona-functional-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      AURA_RELEASE_ENVIRONMENT: demo
      VITE_SUPABASE_URL: https://demo-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: demo-public-placeholder

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Platform functional-truth source invariants
        id: source_truth
        continue-on-error: true
        run: bunx vitest run src/config/__tests__/platformFunctionalTruth.test.ts

      - name: Preserve PR13 Builder and Connections invariants
        id: pr13_invariants
        continue-on-error: true
        run: >-
          bunx vitest run
          src/config/__tests__/builderConnectionsUx.test.ts
          src/config/__tests__/customerSurfaceWhiteLabel.test.ts
          src/config/__tests__/auraRuntimeCatalog.test.ts
          src/connections/__tests__/demoIntegrationPolicy.test.ts

      - name: Build exact-head production-mode demo artifact
        id: build
        continue-on-error: true
        env:
          AURA_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          AURA_RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          AURA_BUILD_ID: platform-${{ github.run_id }}-${{ github.run_attempt }}
        run: bunx vite build --mode demo

      - name: Verify demo truth and release fingerprint
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          AURA_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-aura-demo-build.mjs

      - name: Install Chromium
        id: chromium
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bunx playwright install --with-deps chromium

      - name: Preserve accepted PR13 browser journeys
        id: pr13_browser
        if: steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        run: bunx playwright test --config=playwright.aura-builder-connections.config.ts

      - name: Platform persona and functional-truth browser journeys
        id: platform_browser
        if: steps.build.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        run: bunx playwright test --config=playwright.platform-persona.config.ts

      - name: Upload platform browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-platform-persona-browser-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/platform-persona/
            playwright-report/platform-persona/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload PR13 regression browser evidence on failure
        if: always() && steps.pr13_browser.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aura-pr13-regression-browser-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/aura-builder-connections/
            playwright-report/aura-builder-connections/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload exact-head qualified platform artifact
        if: >-
          steps.typecheck.outcome == 'success' &&
          steps.source_truth.outcome == 'success' &&
          steps.pr13_invariants.outcome == 'success' &&
          steps.build.outcome == 'success' &&
          steps.verify.outcome == 'success' &&
          steps.chromium.outcome == 'success' &&
          steps.pr13_browser.outcome == 'success' &&
          steps.platform_browser.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aura-platform-persona-qualified-${{ github.event.pull_request.head.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce all platform acceptance gates
        if: always()
        run: |
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.source_truth.outcome }}" = "success"
          test "${{ steps.pr13_invariants.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.verify.outcome }}" = "success"
          test "${{ steps.chromium.outcome }}" = "success"
          test "${{ steps.pr13_browser.outcome }}" = "success"
          test "${{ steps.platform_browser.outcome }}" = "success"
