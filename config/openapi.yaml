openapi: 3.0.0
info:
  title: M2M Agentic Studio API
  version: 1.0.0
  description: API for AI System Builder - 6-step workflow
servers:
  - url: https://mlhcdcvpvztfjfndmxzl.supabase.co/functions/v1
    description: Production
  - url: http://localhost:54321/functions/v1
    description: Local development

paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, down]
                  timestamp:
                    type: string
                    format: date-time
                  region:
                    type: string
                  services:
                    type: object
                    properties:
                      gemini:
                        $ref: '#/components/schemas/ServiceHealth'
                      vertex:
                        $ref: '#/components/schemas/ServiceHealth'
                      zapier:
                        $ref: '#/components/schemas/ServiceHealth'
                      mcp:
                        $ref: '#/components/schemas/ServiceHealth'

  /systems-create:
    post:
      summary: Create a new AI system (Step 1)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                department:
                  type: string
                outcome:
                  type: string
                successMetric:
                  type: string
      responses:
        '200':
          description: System created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  system_id:
                    type: string
                    format: uuid

  /systems-update:
    post:
      summary: Update system configuration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUpdate'
      responses:
        '200':
          description: System updated successfully
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /mcp-register:
    post:
      summary: Register MCP Server (Step 3)
      description: Register a Model Context Protocol server and probe capabilities
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - system_id
                - name
                - endpoint
                - transport
              properties:
                system_id:
                  type: string
                  format: uuid
                name:
                  type: string
                endpoint:
                  type: string
                  format: uri
                transport:
                  type: string
                  enum: [http-stream, stdio]
                auth:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [bearer, oauth]
                    token:
                      type: string
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Server registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  capabilities:
                    type: object
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /mcp-validate:
    post:
      summary: Validate MCP Server
      description: Re-probe MCP server capabilities and update status
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - system_id
                - endpoint
                - transport
              properties:
                system_id:
                  type: string
                  format: uuid
                endpoint:
                  type: string
                  format: uri
                transport:
                  type: string
                  enum: [http-stream, stdio]
                auth:
                  type: object
      responses:
        '200':
          description: Validation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  latency:
                    type: number
        '400':
          description: Validation failed

  /mcp-allowlist:
    post:
      summary: Update Tool Allowlist
      description: Save the least-privilege tool allowlist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - system_id
                - tools
              properties:
                system_id:
                  type: string
                  format: uuid
                tools:
                  type: array
                  items:
                    type: string
                  description: Array of enabled tools in format "server_name:tool_name"
      responses:
        '200':
          description: Allowlist updated
        '400':
          description: Validation error

  /mcp-test-tool:
    post:
      summary: Test MCP Tool
      description: Execute MCP tool with safe canned arguments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - system_id
                - server_name
                - tool_name
              properties:
                system_id:
                  type: string
                  format: uuid
                server_name:
                  type: string
                tool_name:
                  type: string
                args:
                  type: object
      responses:
        '200':
          description: Tool executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    type: object
                  latency:
                    type: number
        '403':
          description: Tool not in allowlist

  /arcade-servers:
    get:
      summary: List Arcade MCP servers with filters
      tags:
        - Arcade
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: type
          in: query
          schema:
            type: string
          description: Filter by type (optimized, starter, verified, community)
        - name: q
          in: query
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: List of servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArcadeServer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /arcade-servers/{id}:
    get:
      summary: Get Arcade server details
      tags:
        - Arcade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    $ref: '#/components/schemas/ArcadeServer'
        '404':
          description: Server not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /arcade-servers/{id}/register:
    post:
      summary: Register Arcade MCP server to system
      tags:
        - Arcade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - system_id
              properties:
                system_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Server registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  server_id:
                    type: string
                  server_name:
                    type: string
                  endpoint:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Server not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /mcp-delete:
    post:
      summary: Delete MCP Server
      description: Remove MCP server and cleanup tokens
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - system_id
                - server_name
              properties:
                system_id:
                  type: string
                  format: uuid
                server_name:
                  type: string
      responses:
        '200':
          description: Server deleted
        '400':
          description: Validation error

components:
  schemas:
    ServiceHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, down]
        latency:
          type: integer
          description: Response time in milliseconds
    
    ArcadeServer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        designation:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        logo:
          type: string
        capabilities:
          type: object
          properties:
            tools:
              type: integer
            resources:
              type: integer
            prompts:
              type: integer
        auth_method:
          type: string
        endpoint:
          type: string
          format: uri
        featured:
          type: boolean
    
    SystemUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        department:
          type: string
        outcome:
          type: string
        successMetric:
          type: string
        step:
          type: integer
          minimum: 1
          maximum: 6
        geminiEnabled:
          type: boolean
        vertexEnabled:
          type: boolean
        temperature:
          type: number
          minimum: 0
          maximum: 1
        topK:
          type: integer
          minimum: 1
          maximum: 40
        topN:
          type: integer
          minimum: 1
          maximum: 10

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
