name: Production Perimeter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Enforce PR-0.1 production perimeter
        run: node scripts/verify-production-perimeter.mjs
