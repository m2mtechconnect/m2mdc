name: QA Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CI: true
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PROJECT_ID: local-placeholder
  VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  USE_MOCK_LLM: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run unit tests with coverage
        run: bun run test:unit:coverage
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unit
          name: unit-coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run E2E tests
        run: bunx playwright test --project=${{ matrix.browser }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  performance-audit:
    name: Performance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build production
        run: bun run build
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4173
            http://localhost:4173/agents
            http://localhost:4173/marketplace
            http://localhost:4173/builder?step=2
          uploadArtifacts: true
          temporaryPublicStorage: true

  accessibility-audit:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Install Playwright
        run: bunx playwright install --with-deps chromium
      
      - name: Run accessibility tests
        run: bunx playwright test --project=chromium --grep "@a11y"

      - name: Run contrast + focus a11y suite
        run: bunx playwright test tests/truth-in-ui/axe-contrast-focus.spec.ts --config=playwright.truth.config.ts

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  qa-summary:
    name: QA Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, performance-audit, accessibility-audit]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Performance: ${{ needs.performance-audit.result }}"
          echo "Accessibility: ${{ needs.accessibility-audit.result }}"
          
          if [ "${{ needs.unit-tests.result }}" != "success" ] ||
             [ "${{ needs.e2e-tests.result }}" != "success" ] ||
             [ "${{ needs.performance-audit.result }}" != "success" ] ||
             [ "${{ needs.accessibility-audit.result }}" != "success" ]; then
            echo "❌ QA Suite Failed"
            exit 1
          else
            echo "✅ QA Suite Passed"
          fi
