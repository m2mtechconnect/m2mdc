name: Visual Regression Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**/*.tsx'
      - 'src/**/*.css'
      - 'src/index.css'
      - 'tailwind.config.ts'

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for baseline comparison
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Setup test environment
        run: |
          cp .env.test .env
          echo "USE_MOCK_LLM=true" >> .env
      
      - name: Run visual regression tests
        run: npm run test:e2e tests/visual/snapshots.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      
      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: test-results/
          retention-days: 30
      
      - name: Comment PR with visual diffs
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const diffDir = 'test-results';
            if (!fs.existsSync(diffDir)) {
              return;
            }
            
            const diffs = fs.readdirSync(diffDir)
              .filter(f => f.endsWith('-diff.png'));
            
            if (diffs.length === 0) {
              return;
            }
            
            const comment = `### ⚠️ Visual Regression Detected\n\n` +
              `${diffs.length} screenshot(s) have changed.\n\n` +
              `Please review the visual differences in the artifacts.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Update baselines (if approved)
        if: contains(github.event.pull_request.labels.*.name, 'update-snapshots')
        run: |
          npm run test:e2e:record tests/visual/snapshots.spec.ts
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tests/visual/**/*.png
          git commit -m "Update visual regression baselines" || exit 0
          git push
