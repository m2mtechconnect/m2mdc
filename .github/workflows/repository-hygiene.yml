name: Repository Hygiene

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  sensitive-file-policy:
    name: Sensitive File Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject tracked deployment and private-key files
        run: node scripts/security/check-tracked-sensitive-files.mjs
