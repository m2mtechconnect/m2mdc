name: Lovable Production Mirror

# GitHub `main` is the authoritative production source. The existing Lovable
# project is still bound to remediation/hybrid-stack-p0. This workflow keeps
# the compatibility ref on the exact `main` tree without ever advancing `main`
# from provider-generated history.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lovable-production-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Reconcile production compatibility ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile mirror to authoritative main tree
        shell: bash
        env:
          MIRROR_REF: remediation/hybrid-stack-p0
        run: |
          set -euo pipefail

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$MIRROR_REF:refs/remotes/origin/$MIRROR_REF"
          main_sha="$(git rev-parse origin/main)"
          mirror_sha="$(git rev-parse "origin/$MIRROR_REF")"

          if [ "$main_sha" = "$mirror_sha" ]; then
            echo "Mirror already matches main: $main_sha"
            exit 0
          fi

          main_tree="$(git rev-parse "$main_sha^{tree}")"

          if git merge-base --is-ancestor "$mirror_sha" "$main_sha"; then
            echo "Mirror is behind main; fast-forwarding compatibility ref."
            git push origin "$main_sha:refs/heads/$MIRROR_REF"
            exit 0
          fi

          echo "Mirror contains provider-side history not present on main."
          echo "Creating a two-parent mirror-only reconciliation commit with the exact main tree."

          reconcile_sha="$({
            printf 'tree %s\n' "$main_tree"
            printf 'parent %s\n' "$main_sha"
            printf 'parent %s\n' "$mirror_sha"
            printf 'author AURA Release Bot <release-bot@m2mtechconnect.com> %s +0000\n' "$(date +%s)"
            printf 'committer AURA Release Bot <release-bot@m2mtechconnect.com> %s +0000\n' "$(date +%s)"
            printf '\nchore(release): reconcile Lovable provider drift to main tree\n'
          } | git hash-object -t commit --stdin -w)"

          test "$(git rev-parse "$reconcile_sha^{tree}")" = "$main_tree"

          # The reconciliation commit contains both current refs as parents, so
          # advancing only the compatibility ref is a normal fast-forward. Main
          # is deliberately never pushed or rewritten by this workflow.
          git push origin "$reconcile_sha:refs/heads/$MIRROR_REF"

          echo "reconciled_sha=$reconcile_sha"

      - name: Verify authoritative main and mirror tree parity
        shell: bash
        env:
          MIRROR_REF: remediation/hybrid-stack-p0
        run: |
          set -euo pipefail
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$MIRROR_REF:refs/remotes/origin/$MIRROR_REF"
          main_sha="$(git rev-parse origin/main)"
          mirror_sha="$(git rev-parse "origin/$MIRROR_REF")"
          main_tree="$(git rev-parse "$main_sha^{tree}")"
          mirror_tree="$(git rev-parse "$mirror_sha^{tree}")"

          test "$main_tree" = "$mirror_tree"
          git merge-base --is-ancestor "$main_sha" "$mirror_sha"

          {
            echo "### Lovable production compatibility mirror"
            echo ""
            echo "- Authoritative source: main @ $main_sha"
            echo "- Mirrored ref: $MIRROR_REF @ $mirror_sha"
            echo "- Source-tree parity: $main_tree"
            echo "- Main mutation by mirror workflow: prohibited"
          } >> "$GITHUB_STEP_SUMMARY"
