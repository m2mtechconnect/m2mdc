name: AURA Platform Follow-up UX Audit

on:
  pull_request:
    branches: [ux/aura-builder-connections-remediation]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  AURA_RELEASE_ENVIRONMENT: preview
  PROD_BASE_URL: https://auradc.m2mtechconnect.com
  VITE_SUPABASE_URL: https://preview-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: preview-public-placeholder

jobs:
  platform-followup-ux:
    name: Platform follow-up UX and truth audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Follow-up truth, UX and white-label regressions
        run: >-
          bunx vitest run
          src/config/__tests__/platformFollowupTruth.test.ts
          src/config/__tests__/builderConnectionsUx.test.ts
          src/config/__tests__/customerSurfaceWhiteLabel.test.ts
          src/config/__tests__/auraRuntimeCatalog.test.ts
          src/connections/__tests__/demoIntegrationPolicy.test.ts
          src/test/brandAssetRegression.test.ts

      - name: Production-mode application build
        env:
          AURA_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AURA_RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          AURA_BUILD_ID: followup-ux-${{ github.run_id }}-${{ github.run_attempt }}
        run: bun run build
