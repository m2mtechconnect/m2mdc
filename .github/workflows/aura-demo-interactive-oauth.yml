name: AURA Demo Interactive OAuth

on:
  pull_request:
    branches: [demo-aura-environment-profile]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  VITE_AURA_DEMO_INTEGRATIONS: 'true'
  VITE_AURA_DEMO_MANAGED_OAUTH: 'true'
  AURA_RELEASE_ENVIRONMENT: demo
  PROD_BASE_URL: https://auradc.m2mtechconnect.com
  VITE_SUPABASE_URL: https://demo-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: demo-public-placeholder

jobs:
  interactive-oauth-checks:
    name: Interactive OAuth demo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck customer application
        run: bun run typecheck

      - name: White-label customer-surface regression
        run: bunx vitest run src/config/__tests__/customerSurfaceWhiteLabel.test.ts src/config/__tests__/auraRuntimeCatalog.test.ts src/connections/demoIntegrationPolicy.test.ts

      - name: Demo OAuth policy tests
        run: deno test --allow-env supabase/functions/_shared/whiteLabelGateway.demo.test.ts

      - name: Check managed-user OAuth functions
        run: |
          deno check supabase/functions/managed-user-oauth-start/index.ts
          deno check supabase/functions/managed-user-oauth-complete/index.ts
          deno check supabase/functions/managed-user-disconnect/index.ts
          deno check supabase/functions/managed-connector-capabilities/index.ts

      - name: Build production-mode interactive demo artifact
        env:
          AURA_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AURA_RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          AURA_BUILD_ID: demo-oauth-${{ github.run_id }}-${{ github.run_attempt }}
        run: bun run build

      - name: Verify demo artifact
        env:
          AURA_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-aura-demo-build.mjs
