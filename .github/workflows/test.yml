name: Test Suite

# Release/integration gate. Unit, cross-browser E2E, accessibility and security
# are owned by QA Suite; this workflow owns integration replay + Lighthouse.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# Superseding pull-request commits cancel the complete qualification run,
# including the summary job. This avoids stale summary jobs from older SHAs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PROJECT_ID: local-placeholder
  VITE_SUPABASE_PUBLISHABLE_KEY: safe-placeholder-anon-key
  TEST_SUPABASE_URL: http://127.0.0.1:54321
  TEST_SUPABASE_ANON_KEY: safe-placeholder-anon-key
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: safe-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: safe-placeholder-service-role-key
  USE_MOCK_LLM: true

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup test environment
        run: |
          cp .env.test.example .env
          echo "USE_MOCK_LLM=true" >> .env

      - name: Run integration tests
        run: bun run test:int
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production
        run: bun run build
        env:
          LIGHTHOUSE_CI: '1'
          AURA_COMMIT_SHA: ${{ env.AURA_SOURCE_SHA }}
          AURA_RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          AURA_RELEASE_ENVIRONMENT: ci

      - name: Verify release fingerprint matches tested source
        shell: bash
        run: |
          test -f dist/release.json || { echo "dist/release.json missing"; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('dist/release.json', 'utf8'));
          if (payload.schema !== 'aura.release-fingerprint.v1') throw new Error(`Unexpected schema: ${payload.schema}`);
          if (payload.sha !== process.env.AURA_SOURCE_SHA) throw new Error(`Fingerprint SHA ${payload.sha} != tested source ${process.env.AURA_SOURCE_SHA}`);
          console.log(`Release fingerprint verified for ${payload.sha}`);
          NODE

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.1
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [integration-tests, lighthouse]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"

          if [ "${{ needs.integration-tests.result }}" != "success" ] ||
             [ "${{ needs.lighthouse.result }}" != "success" ]; then
            echo "❌ Test Suite Failed"
            exit 1
          fi
          echo "✅ Test Suite Passed"
