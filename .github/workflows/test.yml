name: Test Suite

# Release/integration gate. Unit, cross-browser E2E, accessibility and security
# are owned by QA Suite; this workflow owns integration replay + Lighthouse.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PROJECT_ID: local-placeholder
  VITE_SUPABASE_PUBLISHABLE_KEY: safe-placeholder-anon-key
  TEST_SUPABASE_URL: http://127.0.0.1:54321
  TEST_SUPABASE_ANON_KEY: safe-placeholder-anon-key
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: safe-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: safe-placeholder-service-role-key
  USE_MOCK_LLM: true

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup test environment
        run: |
          cp .env.test.example .env
          echo "USE_MOCK_LLM=true" >> .env

      - name: Run integration tests
        run: bun run test:int
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production
        run: bun run build
        env:
          LIGHTHOUSE_CI: '1'

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.1
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [integration-tests, lighthouse]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"

          if [ "${{ needs.integration-tests.result }}" != "success" ] ||
             [ "${{ needs.lighthouse.result }}" != "success" ]; then
            echo "❌ Test Suite Failed"
            exit 1
          fi
          echo "✅ Test Suite Passed"
