name: AURA Simulation Calibration Evidence Qualification

on:
  pull_request:
    branches:
      - dsx/aura-simulation-fidelity-qualification
      - dsx/aura-blueprint-asset-remediation
      - ux/aura-platform-followup-hardening
    paths:
      - 'calibration/**'
      - 'scripts/verify-simulation-calibration-evidence.ts'
      - 'src/simulation/calibrationEvidence.ts'
      - 'src/simulation/fidelity.ts'
      - 'src/simulation/index.ts'
      - 'src/simulation/__tests__/calibrationEvidence.test.ts'
      - 'src/simulation/__tests__/fidelity.test.ts'
      - 'docs/audit/aura-simulation-calibration-evidence-design.md'
      - '.github/workflows/aura-simulation-calibration-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  AURA_RELEASE_ENVIRONMENT: preview
  PROD_BASE_URL: https://auradc.m2mtechconnect.com
  VITE_SUPABASE_URL: https://preview-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: preview-public-placeholder

jobs:
  calibration-evidence:
    name: Calibration evidence contract and claims boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Calibration and fidelity contract tests
        run: >-
          bunx vitest run
          src/simulation/__tests__/calibrationEvidence.test.ts
          src/simulation/__tests__/fidelity.test.ts
          src/simulation/__tests__/SimulationEngine.preflight.test.ts

      - name: Verify committed calibration evidence packages
        run: bun scripts/verify-simulation-calibration-evidence.ts

      - name: Production-mode application build
        env:
          AURA_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AURA_RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          AURA_BUILD_ID: simulation-calibration-${{ github.run_id }}-${{ github.run_attempt }}
        run: bun run build
