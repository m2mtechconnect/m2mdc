name: Post-Publish Smoke (read-only)

# Read-only qualification. This workflow never mutates the production target,
# never deploys and never publishes: it performs GET navigations and read-only
# route-link activations only, then stores evidence artifacts.
#
# It runs automatically after a publish. Publishes happen outside GitHub, so
# the trigger is a poll of the live release fingerprint: on a schedule and
# after the production mirror completes, the suite runs with
# `--only-if-new-publish` and exits without claiming anything when the live
# SHA already carries a passing recorded run. Manual dispatch remains
# available for a named target and SHA.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ['Lovable Production Mirror']
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target origin (production URL)'
        required: true
        default: 'https://auradc.m2mtechconnect.com'
      expected_sha:
        description: 'Expected 40-char Git SHA bound to /release.json'
        required: true

permissions:
  contents: write

# Every run writes to the same immutable evidence history. Serialising the
# workflow prevents schedule, publish and manual runs from racing the
# evidence-branch lease while still allowing every requested run to finish.
concurrency:
  group: aura-post-publish-smoke-evidence
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only post-publish smoke
        env:
          AURA_SMOKE_TARGET: ${{ inputs.target || 'https://auradc.m2mtechconnect.com' }}
          # A publish-triggered run is bound to the exact main SHA that caused
          # the production mirror. The smoke script waits for /release.json to
          # reach this SHA before it evaluates any production route.
          AURA_EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha }}
          AURA_RELEASE_WAIT_MS: ${{ github.event_name == 'workflow_run' && '600000' || '0' }}
          AURA_RELEASE_POLL_MS: '5000'
          AURA_SMOKE_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name == 'schedule' && 'scheduled' || 'automatic-on-publish' }}
          # Optional authenticated plane. When these secrets are absent the
          # suite fails closed and records BLOCKED_BY_AUTH.
          AURA_PREVIEW_EMAIL: ${{ secrets.AURA_SMOKE_EMAIL }}
          AURA_PREVIEW_PASSWORD: ${{ secrets.AURA_SMOKE_PASSWORD }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/post-publish-smoke.mjs
          else
            node scripts/post-publish-smoke.mjs --only-if-new-publish
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-publish-smoke-evidence
          path: docs/evidence/post-publish-smoke/
          if-no-files-found: warn

      # Evidence is preserved on a dedicated branch. `main` is never written
      # to by this workflow, and no deployment or publish is performed.
      - name: Preserve evidence on the evidence branch
        if: always()
        env:
          GIT_AUTHOR_NAME: aura-smoke-bot
          GIT_AUTHOR_EMAIL: aura-smoke-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: aura-smoke-bot
          GIT_COMMITTER_EMAIL: aura-smoke-bot@users.noreply.github.com
        run: |
          if [ -z "$(git status --porcelain docs/evidence/post-publish-smoke src/supervisor/postPublishSmokeRegistry.ts)" ]; then
            echo 'No new smoke evidence to preserve.'
            exit 0
          fi
          git checkout -B evidence/post-publish-smoke
          git add docs/evidence/post-publish-smoke src/supervisor/postPublishSmokeRegistry.ts
          git commit -m "evidence: post-publish smoke run (${{ github.event_name }})"
          git push --force-with-lease origin evidence/post-publish-smoke
