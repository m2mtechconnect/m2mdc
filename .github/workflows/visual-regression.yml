name: Visual Regression Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**/*.tsx'
      - 'src/**/*.css'
      - 'src/index.css'
      - 'tests/visual/**'
      - 'playwright.visual.config.ts'
      - 'tailwind.config.ts'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  AURA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PROJECT_ID: local-placeholder
  VITE_SUPABASE_PUBLISHABLE_KEY: safe-placeholder-anon-key
  TEST_SUPABASE_URL: http://127.0.0.1:54321
  TEST_SUPABASE_ANON_KEY: safe-placeholder-anon-key
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: safe-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: safe-placeholder-service-role-key
  USE_MOCK_LLM: true

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_SOURCE_SHA }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: bunx playwright install --with-deps

      - name: Compare approved visual baselines
        id: compare
        continue-on-error: true
        run: bunx playwright test --config=playwright.visual.config.ts

      - name: Generate fresh current-head screenshots for human review
        id: capture
        if: always()
        shell: bash
        env:
          AURA_CAPTURE_CURRENT_HEAD: '1'
        run: |
          rm -rf visual-current-head
          mkdir -p visual-current-head

          set +e
          bunx playwright test --config=playwright.visual.config.ts
          capture_status=$?
          set -e

          while IFS= read -r -d '' file; do
            mkdir -p "visual-current-head/$(dirname "$file")"
            cp "$file" "visual-current-head/$file"
          done < <(find tests/visual -type f -name '*.png' -print0)

          echo "capture_status=$capture_status" >> "$GITHUB_OUTPUT"
          echo "Release source SHA: $AURA_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Fresh screenshots are review evidence only. This job never commits or pushes baselines." >> "$GITHUB_STEP_SUMMARY"
          echo "PR comments are intentionally not part of the visual gate; uploaded artifacts are the authoritative review evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: steps.compare.outcome == 'failure'
        with:
          name: visual-regression-diffs-${{ env.AURA_SOURCE_SHA }}
          path: test-results/
          retention-days: 30

      - name: Upload current-head visual review artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-current-head-${{ env.AURA_SOURCE_SHA }}
          path: visual-current-head/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce visual gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.capture.outputs.capture_status }}" != "0" ]; then
            echo "Fresh screenshot generation failed. Human-review evidence is incomplete."
            exit 1
          fi

          if [ "${{ steps.compare.outcome }}" != "success" ]; then
            echo "Approved visual baselines differ from release source $AURA_SOURCE_SHA."
            exit 1
          fi

          echo "Visual comparison passed and fresh current-head review evidence was uploaded for $AURA_SOURCE_SHA."
